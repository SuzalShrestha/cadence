# On each push to main, release-please keeps a "Release PR" open with the next version and CHANGELOG.
# Merging that PR tags vX.Y.Z and creates the GitHub Release. The build job then signs the app,
# uploads the dmg, zip and latest-mac.yml (the feed the in-app updater reads) and attests them.
name: Release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PAT lets CI run on the Release PR. GITHUB_TOKEN works, but its PRs do not start other workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the signing secret
        env:
          CADENCE_SIGN_P12: ${{ secrets.CADENCE_SIGN_P12 }}
        run: |
          if [ -z "$CADENCE_SIGN_P12" ]; then
            echo "::error::CADENCE_SIGN_P12 is not set. An ad hoc build cannot update installed copies. See CONTRIBUTING.md, Releases."
            exit 1
          fi
      - name: Build and sign
        env:
          CADENCE_SIGN_P12: ${{ secrets.CADENCE_SIGN_P12 }}
          CADENCE_SIGN_PASSWORD: ${{ secrets.CADENCE_SIGN_PASSWORD }}
        run: npx electron-builder --mac --publish never
      - name: Check the signature
        run: |
          codesign --verify --deep --strict dist/mac-arm64/Cadence.app
          codesign -d -r- dist/mac-arm64/Cadence.app 2>&1 | grep 'certificate root = H"b875e6b543cc9dbca96e2572d5ed303c5a4fe32d"'
      - name: Checksums
        working-directory: dist
        run: shasum -a 256 -- *.dmg *.zip latest-mac.yml > SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.zip
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac.yml dist/SHA256SUMS.txt --clobber
