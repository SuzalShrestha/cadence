name: Bug report
description: Something does not work.
labels: [bug, triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see? What did you expect to see?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Cadence
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Cadence version
      description: Settings → General → Updates shows it.
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.1"
    validations:
      required: true
  - type: dropdown
    id: mac
    attributes:
      label: Mac
      options: [Apple Silicon, Intel]
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Screenshot or log
      description: Remove private window titles, file paths and URLs first.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I use the newest release, or the bug is still in it.
          required: true
        - label: I searched the open issues.
          required: true
