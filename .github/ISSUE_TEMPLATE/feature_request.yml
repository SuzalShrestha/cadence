name: Feature request
description: Suggest an idea.
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What do you try to do, and what stops you?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Other options you thought about
  - type: checkboxes
    id: local
    attributes:
      label: Local-first
      options:
        - label: The idea works without an account, a server or sending data off the Mac.
          required: true
